# Épingler par SHA protège de la redirection d'un tag, mais fige aussi les correctifs :
# sans mise à jour, un pin devient une vulnérabilité qu'on a choisi de garder.
# Dependabot rouvre le sujet chaque semaine, sous forme de PR relisible.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - security
